<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>分享页面 · 人工反馈局部原型</title>
    <style>
      @font-face {
        font-family: Caveat;
        src: url(fonts/caveat.woff2);
      }
      @font-face {
        font-family: Noto;
        src: url(fonts/noto-sans-sc.woff2);
        font-weight: 100 900;
      }
      :root {
        color-scheme: light;
        --background: #fffffe;
        --foreground: #272343;
        --muted: #41445b;
        --border: #bae8e8;
        --surface: #fffffe;
        --default: #e3f6f5;
        --primary: #ffd807;
        --primary-foreground: #272343;
        --focus: #287e79;
        --tool-selected: #fff7c2;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --background: #181a22;
        --foreground: #f4f1f8;
        --muted: #b8b9c9;
        --border: #607d85;
        --surface: #22252f;
        --default: #253d40;
        --focus: #82dbd3;
        --tool-selected: #494222;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font:
          14px/1.6 Noto,
          sans-serif;
      }
      button,
      input,
      a {
        font: inherit;
        color: inherit;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
        min-height: 44px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        padding: 0 16px;
        font-weight: 500;
      }
      button:hover:not(:disabled) {
        background: var(--default);
      }
      button:disabled {
        cursor: default;
        opacity: 0.65;
      }
      button:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }
      a {
        text-decoration: none;
      }
      .scene {
        height: 100dvh;
        position: relative;
        isolation: isolate;
      }
      .scene::before {
        position: absolute;
        inset: 0;
        z-index: -1;
        content: '';
        background-image:
          url(shell/glow-desktop.svg),
          radial-gradient(var(--border) 0.6px, transparent 0.75px);
        background-size:
          100% 100%,
          20px 20px;
        pointer-events: none;
      }
      :root[data-theme='dark'] .scene::before {
        opacity: 0.22;
      }
      .home {
        position: absolute;
        left: 20px;
        top: 14px;
        padding: 0 12px;
        min-height: 44px;
        display: flex;
        align-items: center;
        border-radius: 8px;
      }
      .brand {
        text-align: center;
        font: 56px/71px Caveat;
        margin: 0;
      }
      .list-brand {
        padding-top: 48px;
      }
      .scroll {
        position: absolute;
        top: 140px;
        bottom: 0;
        left: max(16px, calc((100% - 1160px) / 2));
        right: max(16px, calc((100% - 1160px) / 2));
        overflow: auto;
        overscroll-behavior: contain;
        padding-bottom: 144px;
      }
      .content {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .cover {
        display: block;
        width: 100%;
        height: 280px;
        border-radius: 12px;
        object-fit: cover;
        object-position: center 44%;
      }
      .album-summary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        column-gap: 24px;
        row-gap: 8px;
        align-items: baseline;
      }
      .album-summary h1 {
        font-size: 32px;
        line-height: 40px;
        font-weight: 500;
        letter-spacing: -0.025em;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .description {
        margin: 0;
        color: var(--muted);
        line-height: 22px;
        grid-column: 1/-1;
      }
      .count {
        margin: 0;
        display: flex;
        gap: 8px;
        align-items: baseline;
        white-space: nowrap;
        color: var(--muted);
        font-size: 14px;
        line-height: 22px;
        font-variant-numeric: tabular-nums;
      }
      .count strong {
        color: var(--foreground);
        font-weight: 500;
      }
      .count .separator {
        color: var(--border);
      }
      .feedback {
        display: flex;
        align-items: center;
        gap: 16px;
        color: var(--muted);
        min-height: 44px;
        margin-top: -8px;
        line-height: 22px;
      }
      .feedback button {
        flex-shrink: 0;
        min-width: 72px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
      }
      .tile {
        margin: 0;
        min-width: 0;
        overflow: hidden;
        border-radius: 12px;
        background: var(--surface);
      }
      .tile img {
        display: block;
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        border-radius: 12px;
      }
      .tile .placeholder {
        aspect-ratio: 4/3;
        display: grid;
        place-items: center;
        background: var(--default);
        color: var(--muted);
        font-size: 14px;
      }
      .load {
        background: var(--primary);
        color: var(--primary-foreground);
        border: 0;
        min-height: 48px;
        font-weight: 500;
      }
      .load:hover:not(:disabled) {
        background: var(--primary);
      }
      .gate {
        height: 100%;
        overflow: auto;
        padding: 120px 16px 144px;
      }
      .tagline {
        text-align: center;
        margin: 6px 0 32px;
        line-height: 22px;
      }
      .card {
        max-width: 480px;
        margin: auto;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        padding: 24px;
        display: grid;
        gap: 16px;
      }
      .card h1 {
        font-size: 22px;
        line-height: 32px;
        font-weight: 500;
        margin: 0;
      }
      .card p {
        margin: 0;
        line-height: 22px;
      }
      .card label {
        font-weight: 500;
        line-height: 22px;
      }
      .field {
        display: grid;
        gap: 12px;
      }
      .card input {
        height: 48px;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0 16px 0 36px;
        background: var(--background);
      }
      .card .notice {
        color: var(--muted);
      }
      .card .help {
        color: var(--muted);
      }
      .tools {
        position: fixed;
        z-index: 5;
        right: 16px;
        bottom: 12px;
        max-width: calc(100% - 32px);
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: 0 2px 12px #27234312;
      }
      .tool-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 4px;
        font-size: 11px;
        line-height: 18px;
        color: var(--muted);
      }
      .tool-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tool-row button,
      .tool-row a {
        font-size: 12px;
        padding: 0 12px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .tool-row a {
        border-radius: 8px;
      }
      .tool-row a[aria-current='page'],
      .tool-row button[aria-pressed='true'] {
        background: var(--tool-selected);
      }
      .tool-row .versions {
        display: flex;
        gap: 4px;
        padding-right: 8px;
        border-right: 1px solid var(--border);
      }
      .tool-row button {
        white-space: nowrap;
      }
      .states {
        display: flex;
        gap: 8px;
      }
      .tool-theme {
        margin-left: 8px;
      }
      .hidden {
        display: none !important;
      }
      .busy::before {
        content: '';
        display: inline-block;
        vertical-align: -2px;
        width: 14px;
        height: 14px;
        border: 1.5px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        margin-right: 8px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .busy::before {
          animation: none;
        }
      }
      @media (min-width: 768px) and (max-width: 1199px) {
        .grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .cover {
          height: 240px;
        }
        .album-summary h1 {
          font-size: 28px;
          line-height: 36px;
        }
        .scroll {
          left: 24px;
          right: 24px;
        }
      }
      @media (max-width: 767px) {
        .scene::before {
          background-image:
            url(shell/glow-mobile.svg),
            radial-gradient(var(--border) 0.6px, transparent 0.75px);
        }
        .home {
          left: 16px;
        }
        .list-brand {
          padding-top: 58px;
        }
        .scroll {
          top: 150px;
          left: 16px;
          right: 16px;
        }
        .content {
          gap: 20px;
        }
        .cover {
          height: 160px;
          object-position: center 44%;
        }
        .album-summary {
          grid-template-columns: minmax(0, 1fr);
          gap: 8px;
        }
        .album-summary h1 {
          font-size: 28px;
          line-height: 36px;
        }
        .description {
          grid-column: auto;
          grid-row: 2;
        }
        .count {
          grid-row: 3;
          font-size: 13px;
        }
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }
        .feedback {
          gap: 12px;
          margin-top: -8px;
          font-size: 13px;
        }
        .feedback span {
          min-width: 0;
          flex: 1;
        }
        .feedback button {
          min-width: 64px;
          padding: 0 12px;
          font-size: 13px;
        }
        .gate {
          padding-top: 76px;
        }
        .card input {
          font-size: 16px;
        }
        .tools {
          left: 16px;
          right: 16px;
          padding: 8px;
          max-width: none;
        }
        .tool-meta {
          gap: 8px;
        }
        .tool-row {
          flex-wrap: wrap;
          gap: 4px;
          justify-content: space-between;
        }
        .tool-row button,
        .tool-row a {
          padding: 0 9px;
        }
        .tool-row .versions {
          border: 0;
          padding: 0;
          gap: 0;
        }
        .tool-theme {
          margin-left: 0;
        }
        .tool-row .states {
          display: flex;
          gap: 4px;
        }
        .tool-row > .states {
          display: flex;
        }
        .tool-row .versions {
          order: 0;
        }
        .tool-row .states {
          order: 2;
          flex: 1 0 100%;
          justify-content: center;
        }
        .tool-row .states button {
          flex: 1;
        }
        .tool-row .tool-theme {
          order: 1;
        }
      }

      .cover-placeholder {
        height: 280px;
        border-radius: 12px;
        background: var(--default);
        display: grid;
        place-items: center;
      }
      .empty-state {
        height: 280px;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 12px;
        color: var(--muted);
      }
      .empty-state p {
        margin: 0;
        font-size: 14px;
        line-height: 22px;
      }
      .field-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .tip-trigger {
        border: 0;
        background: transparent;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        min-height: 44px;
        font-size: 13px;
        font-weight: 400;
        color: var(--muted);
      }
      .tip-content {
        position: fixed;
        inset: auto;
        margin: 0;
        z-index: 10;
        max-width: calc(100vw - 32px);
        width: 320px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        color: var(--foreground);
        padding: 16px;
        font-size: 13px;
        line-height: 20px;
        box-shadow: 0 4px 16px #27234312;
      }
      .tip-content p {
        margin: 0;
      }
      .tip-content::backdrop {
        background: transparent;
      }
      .empty-count {
        color: var(--muted);
        font-size: 14px;
        line-height: 22px;
        margin: 0;
      }
      .tools {
        padding-bottom: 8px;
      }
      .scroll {
        padding-bottom: 120px;
      }
      @media (max-width: 1199px) and (min-width: 768px) {
        .cover-placeholder {
          height: 240px;
        }
      }
      @media (max-width: 767px) {
        .cover-placeholder {
          height: 160px;
        }
        .empty-state {
          height: 220px;
        }
        .empty-count {
          grid-row: 3;
          font-size: 13px;
        }
        .tools .tool-row .states {
          flex: 0 1 auto;
          order: 0;
        }
        .tools .tool-row {
          justify-content: space-between;
        }
      }
      @media (max-height: 560px) {
        .gate {
          position: absolute;
          top: 48px;
          bottom: 112px;
          left: 0;
          right: 0;
          height: auto;
          padding: 28px 16px 32px;
        }
        .scroll {
          bottom: 112px;
          padding-bottom: 24px;
        }
      }
    </style>
  </head>
  <body>
    <aside class="tools" aria-label="原型工具，非产品功能">
      <div class="tool-meta">
        <span>本轮局部提案 · 待批准</span><span>原型工具</span>
      </div>
      <div class="tool-row">
        <div class="states">
          <button id="empty" aria-pressed="true">空相册</button
          ><button id="password-view" aria-pressed="false">密码页</button>
        </div>
        <button id="theme" aria-pressed="false">深色</button>
      </div>
    </aside>
    <section class="scene" id="list">
      <a class="home" href="#">← 返回首页</a>
      <div class="brand list-brand">Ariso</div>
      <main class="scroll">
        <div class="content">
          <div class="cover-placeholder">暂无封面</div>
          <header class="album-summary">
            <h1>旅行手记</h1>
            <p class="empty-count">0 张图片</p>
            <p class="description">记录沿途的光影与日常。</p>
          </header>
          <div class="empty-state" role="status">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-images"
              aria-hidden="true"
            >
              <path d="m22 11-1.296-1.296a2.4 2.4 0 0 0-3.408 0L11 16"></path>
              <path
                d="M4 8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"
              ></path>
              <circle cx="13" cy="7" r="1" fill="currentColor"></circle>
              <rect x="8" y="2" width="14" height="14" rx="2"></rect>
            </svg>
            <p>暂无可展示的图片</p>
          </div>
        </div>
      </main>
    </section>
    <section class="scene hidden" id="gate">
      <a class="home" href="#">← 返回首页</a>
      <main class="gate">
        <div class="brand">Ariso</div>
        <p class="tagline">图片，自在收纳。</p>
        <form class="card">
          <h1>访问受密码保护</h1>
          <p>输入分享密码后继续。</p>
          <div class="field">
            <div class="field-title">
              <label for="password">分享密码</label
              ><button
                type="button"
                class="tip-trigger"
                id="tip-trigger"
                popovertarget="access-tip"
                aria-label="查看访问说明"
                aria-haspopup="dialog"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-info"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M12 16v-4"></path>
                  <path d="M12 8h.01"></path></svg
                ><span>访问说明</span>
              </button>
            </div>
            <input
              id="password"
              type="password"
              autocomplete="off"
              placeholder="请输入分享密码"
            />
          </div>
          <button type="button" class="load">验证并查看</button>
        </form>
      </main>
    </section>
    <div
      class="tip-content"
      id="access-tip"
      popover
      role="dialog"
      aria-label="访问说明"
    >
      <p>
        验证成功后，此浏览器可在 24
        小时内免输密码；分享关闭、改密或到期仍会使访问失效。
      </p>
    </div>
    <script>
      const tip = document.getElementById('access-tip');
      const trigger = document.getElementById('tip-trigger');
      const positionTip = () => {
        const box = trigger.getBoundingClientRect();
        const width = Math.min(320, innerWidth - 32);
        tip.style.left =
          Math.max(16, Math.min(box.left, innerWidth - 16 - width)) + 'px';
        tip.style.top = Math.min(box.bottom + 8, innerHeight - 160) + 'px';
      };
      trigger.addEventListener('click', positionTip);
      tip.addEventListener('toggle', (event) => {
        trigger.setAttribute(
          'aria-expanded',
          String(event.newState === 'open'),
        );
        if (event.newState === 'closed') trigger.focus({ preventScroll: true });
      });
      for (const [id, state] of [
        ['empty', 'list'],
        ['password-view', 'gate'],
      ])
        document.getElementById(id).addEventListener('click', () => {
          if (tip.matches(':popover-open')) tip.hidePopover();
          for (const scene of ['list', 'gate'])
            document
              .getElementById(scene)
              .classList.toggle('hidden', scene !== state);
          for (const button of ['empty', 'password-view'])
            document
              .getElementById(button)
              .setAttribute('aria-pressed', String(button === id));
        });
      document.getElementById('theme').addEventListener('click', (event) => {
        const dark = document.documentElement.dataset.theme !== 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        event.currentTarget.textContent = dark ? '浅色' : '深色';
        event.currentTarget.setAttribute('aria-pressed', String(dark));
      });
      addEventListener('resize', positionTip);
      document
        .querySelectorAll('.home')
        .forEach((link) =>
          link.addEventListener('click', (event) => event.preventDefault()),
        );
    </script>
  </body>
</html>
