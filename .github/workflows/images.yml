name: Release images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v1.0.5'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: images-${{ inputs.version }}

jobs:
  build:
    name: Build and verify ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          test "$SOURCE_REF" = refs/heads/main
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          build-args: |
            ARISO_BUILD_VERSION=${{ inputs.version }}
            ARISO_BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ariso:ci-${{ matrix.arch }}
      - name: Verify release image
        run: >-
          node scripts/verify-release-image.mjs
          --image ariso:ci-${{ matrix.arch }}
          --platform linux/${{ matrix.arch }}
          --output-dir "${{ runner.temp }}/release-verification"
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-verification
          if-no-files-found: warn
          retention-days: 14
      - name: Export verified image
        env:
          IMAGE: ariso:ci-${{ matrix.arch }}
        run: docker image save "$IMAGE" --output "$RUNNER_TEMP/ariso.tar"
      - uses: actions/upload-artifact@v7
        with:
          name: ariso-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/ariso.tar
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: ariso-linux-*
          path: images
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified images and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ github.sha }}
          IMAGE: ghcr.io/dnslin/ariso-next
        run: |
          existing=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == env.VERSION) | .draft')
          if [ -n "$existing" ]; then
            if [ "$existing" != true ]; then
              echo "Release $VERSION is already published" >&2
              exit 1
            fi
            test "$(gh release view "$VERSION" --json targetCommitish --jq .targetCommitish)" = "$REVISION"
          fi
          tag=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$VERSION" --jq '.[] | select(.ref == ("refs/tags/" + env.VERSION)) | .ref')
          if [ -n "$tag" ]; then
            test "$(gh api "repos/$GH_REPO/commits/refs/tags/$VERSION" --jq .sha)" = "$REVISION"
          fi
          for arch in amd64 arm64; do
            docker load --input "images/ariso-linux-$arch/ariso.tar"
            test "$(docker image inspect "ariso:ci-$arch" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$REVISION"
            docker tag "ariso:ci-$arch" "$IMAGE:$VERSION-$arch"
            docker push "$IMAGE:$VERSION-$arch"
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Code revision: $REVISION" >> "$GITHUB_STEP_SUMMARY"
          for arch in amd64 arm64; do
            gzip --stdout "images/ariso-linux-$arch/ariso.tar" > "ariso-$VERSION-linux-$arch.tar.gz"
          done
          sha256sum "ariso-$VERSION-linux-"*.tar.gz > SHA256SUMS
          if [ -z "$existing" ]; then
            gh release create "$VERSION" --target "$REVISION" --title "Ariso $VERSION" --draft --generate-notes
          fi
          gh release upload "$VERSION" "ariso-$VERSION-linux-"*.tar.gz SHA256SUMS --clobber
          gh release edit "$VERSION" --draft=false --latest
