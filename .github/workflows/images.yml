name: Docker build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            node-arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            node-arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Verify build context exclusions
        run: |
          context_dir=$(mktemp -d)
          trap 'rm -rf "$context_dir" .env.context-check .data/context-check src/.env.context-check src/context-check.sqlite src/context-check.key' EXIT
          mkdir -p .data
          touch .env.context-check .data/context-check src/.env.context-check src/context-check.sqlite src/context-check.key
          docker build --file - --output "type=local,dest=$context_dir" . <<'DOCKERFILE'
          FROM scratch
          COPY . /
          DOCKERFILE
          for path in .env.context-check .data src/.env.context-check src/context-check.sqlite src/context-check.key .git .github docs node_modules .next dist tests/integration; do
            test ! -e "$context_dir/$path"
          done
          for path in package.json pnpm-lock.yaml src/app/page.tsx drizzle/meta/_journal.json scripts/package-standalone.mjs scripts/verify-image.mjs docker/entrypoint.sh tests/fixtures/runtime/images/sample.jpg tests/fixtures/runtime/images/sample.png; do
            test -s "$context_dir/$path"
          done
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ariso:ci-${{ matrix.arch }}
      - name: Verify runtime baseline and packaged files offline
        env:
          IMAGE: ariso:ci-${{ matrix.arch }}
        run: |
          docker run --rm --network none --read-only --entrypoint sh "$IMAGE" -eu -c '
            . /etc/os-release
            test "$VERSION_CODENAME" = trixie
            node --version
            node -e "require(\"node:assert/strict\").equal(process.versions.node.split(\".\")[0], \"24\")"
            for package in ca-certificates imagemagick-7.q16 libmagickcore-7.q16-10-extra libheif-plugin-aomenc libimage-exiftool-perl fonts-noto-cjk fonts-noto-core; do
              dpkg-query --show "$package"
            done
            magick -version
            exiftool -ver
            test -s /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
            test -s /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf
            for path in server.js entrypoint.sh dist/cli/prestart.js dist/cli/logging.js drizzle/meta/_journal.json public/runtime.svg verification/fixtures/sample.jpg verification/fixtures/sample.png; do
              test -s "$path"
            done
            node -e "const assert = require(\"node:assert/strict\"); const Database = require(\"better-sqlite3\"); const db = new Database(\":memory:\"); assert.equal(db.prepare(\"SELECT 1 AS ok\").get().ok, 1); db.close(); console.log(\"SQLite native query passed\");"
            test "$(magick identify -format "%m %wx%h" verification/fixtures/sample.jpg)" = "JPEG 64x48"
            test "$(magick identify -format "%m %wx%h" verification/fixtures/sample.png)" = "PNG 64x48"
            for path in src tests .env.local .data node_modules/typescript node_modules/drizzle-kit node_modules/vitest; do
              test ! -e "$path"
            done
          '
      - name: Verify actual image conversions and glyphs offline
        env:
          IMAGE: ariso:ci-${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/image-verification"
          chmod 777 "$RUNNER_TEMP/image-verification"
          docker run --rm --network none --read-only --tmpfs /tmp \
            --workdir /tmp --entrypoint sh \
            --mount "type=bind,src=$RUNNER_TEMP/image-verification,dst=/verification-output" \
            "$IMAGE" -eu -c '
              node /app/scripts/verify-image.mjs
              test -z "$(find /tmp -maxdepth 1 -name "ariso-verify-image-*")"
              node /app/scripts/verify-image.mjs --output-dir /verification-output
              test -z "$(find /tmp -maxdepth 1 -name "ariso-verify-image-*")"
            '
      - uses: actions/upload-artifact@v7
        with:
          name: image-verification-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-verification
          if-no-files-found: error
          retention-days: 7
      - name: Check architecture and start container
        env:
          IMAGE: ariso:ci-${{ matrix.arch }}
          NODE_ARCH: ${{ matrix.node-arch }}
        run: |
          docker run --rm --entrypoint node "$IMAGE" -e \
            'require("node:assert/strict").equal(process.arch, process.argv[1])' "$NODE_ARCH"
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          export ARISO_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          # The production entrypoint prepares an empty writable data directory.
          docker run --detach --name ariso --publish 127.0.0.1:3000:3000 \
            --tmpfs /data:uid=1000,gid=1000 \
            --env DATA_DIR=/data --env BETTER_AUTH_SECRET --env ARISO_ENCRYPTION_KEY "$IMAGE"
      - name: Verify page and static resources
        run: |
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors --max-time 5 \
            http://127.0.0.1:3000/ --output /dev/null
          docker exec -i ariso node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const origin = 'http://127.0.0.1:3000';
          const health = await fetch(`${origin}/api/health`);
          assert.equal(health.status, 200);
          assert.equal(health.headers.get('cache-control'), 'no-store');
          assert.deepEqual(await health.json(), { status: 'ok' });
          const home = await fetch(origin);
          assert.equal(home.status, 200);
          const html = await home.text();
          assert.match(html, /运行基础建设中/);
          const scripts = [...html.matchAll(/src="([^" ]+\.js[^" ]*)"/g)].map(match => match[1]);
          assert.ok(scripts.length > 0, 'Next.js client scripts must exist');
          for (const path of ['/runtime.svg', ...scripts]) {
            const response = await fetch(new URL(path, origin));
            assert.equal(response.status, 200, path);
            assert.ok((await response.arrayBuffer()).byteLength > 0, path);
          }
          for (const path of ['/verification/fixtures/sample.jpg', '/verification/fixtures/sample.png', '/sample.jpg', '/sample.png']) {
            assert.equal((await fetch(new URL(path, origin))).status, 404, path);
          }
          console.log('Container health, page, SVG and Next.js scripts passed');
          JS
      - name: Container logs
        if: always()
        run: |
          if [ -n "$(docker ps --all --quiet --filter name=^/ariso$)" ]; then
            docker logs ariso
          fi
      - name: Stop container
        if: always()
        run: |
          if [ -n "$(docker ps --all --quiet --filter name=^/ariso$)" ]; then
            docker rm --force ariso
          fi
      - name: Export verified image
        env:
          IMAGE: ariso:ci-${{ matrix.arch }}
        run: docker image save "$IMAGE" --output "$RUNNER_TEMP/ariso.tar"
      - uses: actions/upload-artifact@v7
        with:
          name: ariso-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/ariso.tar
          if-no-files-found: error
          retention-days: 7
