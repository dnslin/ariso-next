name: Analytics experiment

# Issue #82 explicitly requires verification without a release or publication.
on:
  pull_request:
    paths:
      - 'tests/experiments/analytics/**'
      - 'tests/integration/analytics/**'
      - 'tests/unit/analytics/**'
      - '.github/workflows/analytics-experiment.yml'

permissions:
  contents: read

concurrency:
  group: analytics-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analytics SQLite and Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project unit tests/unit/analytics/collector.test.ts
      - name: Measure real timer, transactions and bounded aggregation
        run: node tests/experiments/analytics/pressure.ts test-results/analytics/pressure.json
      - name: Build and verify real Next standalone subprocess
        run: node tests/experiments/analytics/run.ts
      - name: Build verification image locally without publishing
        run: >-
          docker build
          -f tests/experiments/analytics/Dockerfile
          -t analytics-experiment:${{ matrix.arch }}
          tests/experiments/analytics/next-app/.next/standalone
      - name: Verify actual container signals and final database state
        env:
          ANALYTICS_SKIP_BUILD: '1'
          ANALYTICS_IMAGE: analytics-experiment:${{ matrix.arch }}
          ANALYTICS_REPORT: test-results/analytics/docker.json
        run: node tests/experiments/analytics/run.ts
      - name: Preserve measurements and exit traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analytics-experiment-${{ matrix.arch }}
          path: test-results/analytics
          if-no-files-found: error
          retention-days: 14
