name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - run: pnpm run test:integration
      - run: pnpm exec next build
      # RUNTIME-11: add the full build command.
      # RUNTIME-22/23: record ego-browser E2E separately; do not install Chromium.
      # images.yml builds and checks the current app on AMD64 and ARM64.
