name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm exec next build
      # RUNTIME-04/11: add real unit/integration tests and the full build command.
      # RUNTIME-22/23: record ego-browser E2E separately; do not install Chromium.
      # RUNTIME-24: verify Docker images in GitHub Actions.
